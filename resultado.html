<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Relatório do Perfil</title>
<style>
  body{margin:0;background:#eef1f5;font-family:"Helvetica Neue",Arial,sans-serif;color:#1c2430;}
  .page{max-width:900px;margin:0 auto;padding:20px 18px 70px;}
  .toolbar{display:flex;gap:10px;justify-content:flex-end;margin-bottom:12px;}
  .btn{background:#1f2d3d;color:#fff;border:none;border-radius:9px;padding:10px 16px;font-size:13.5px;font-weight:700;cursor:pointer;font-family:inherit;}
  .btn.sec{background:#fff;color:#1f2d3d;border:1.5px solid #e4e8ee;}
  .loader{background:#fff;border:1px solid #e4e8ee;border-radius:13px;padding:22px;}
  .loader h2{font-size:16px;margin-bottom:10px;color:#1f2d3d;}
  .drop{border:2px dashed #c4ccd6;border-radius:12px;padding:24px;text-align:center;cursor:pointer;color:#5c6675;}
  textarea{width:100%;height:60px;border:1px solid #e4e8ee;border-radius:9px;padding:9px;font-family:ui-monospace,Menlo,monospace;font-size:11px;margin-top:8px;}
  html,body{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  @media print{body{background:#fff;}.toolbar{display:none !important;}}
</style>
</head>
<body>
<div class="page">
  <div class="toolbar" id="toolbar" style="display:none;">
    <button class="btn" id="dlbtn" onclick="downloadPDF()">⬇ Baixar PDF</button>
    <button class="btn sec" onclick="window.print()">Imprimir</button>
  </div>
  <div id="report"></div>
  <div class="loader" id="loader" style="display:none;">
    <h2>Carregar respostas</h2>
    <p style="font-size:13px;color:#5c6675;margin-bottom:12px;">Selecione um arquivo <b>.json</b> de respostas ou cole o código.</p>
    <div class="drop" id="drop">⬆ Clique para selecionar um arquivo .json<input type="file" id="file" accept=".json" style="display:none"></div>
    <textarea id="codein" placeholder="Ou cole o código de respostas aqui..."></textarea>
    <button class="btn" id="go" style="margin-top:8px;">Gerar relatório</button>
  </div>
</div>
<script src="assets/core.js"></script>
<script src="assets/report.js"></script>
<script src="assets/html2pdf.bundle.min.js"></script>
<script>
(function(){
  var H=window.HOGAN, cur=null;
  function slug(s){return (s||'perfil').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-zA-Z0-9]+/g,'-').replace(/^-|-$/g,'').toLowerCase();}
  window.downloadPDF=function(){
    if(!cur) return;
    var btn=document.getElementById('dlbtn'), old=btn.textContent;
    btn.textContent='Gerando PDF...'; btn.disabled=true;
    var holder=document.createElement('div');
    holder.style.cssText='position:fixed;left:-99999px;top:0;width:760px;background:#fff;';
    var inner=document.createElement('div'); holder.appendChild(inner); document.body.appendChild(holder);
    REPORT.render(inner, cur);
    function done(){ if(holder.parentNode) document.body.removeChild(holder); btn.textContent=old; btn.disabled=false; }
    var opt={margin:[8,8,10,8],image:{type:'jpeg',quality:0.97},
      html2canvas:{scale:2,backgroundColor:'#ffffff',useCORS:true},
      jsPDF:{unit:'mm',format:'a4',orientation:'portrait'},
      pagebreak:{mode:['css','legacy'],avoid:['.card','.kard','.qd','.rec','.insight','.band','.sbar']}};
    html2pdf().set(opt).from(inner).save('Relatorio_'+slug(cur.name)+'.pdf').then(done).catch(done);
  };
  function show(rec){
    cur=rec;
    REPORT.render(document.getElementById('report'), rec);
    document.getElementById('toolbar').style.display='flex';
    document.getElementById('loader').style.display='none';
    document.title='Relatório — '+(rec.name||'Perfil');
    window.scrollTo(0,0);
  }
  function tryHash(){
    var h=location.hash.replace(/^#/,'');
    if(h){try{show(H.dec(h));return true;}catch(e){}}
    return false;
  }
  if(!tryHash()){
    document.getElementById('loader').style.display='block';
    var file=document.getElementById('file');
    document.getElementById('drop').onclick=function(){file.click();};
    file.onchange=function(){var f=file.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{show(JSON.parse(r.result));}catch(e){alert('Arquivo inválido.');}};r.readAsText(f);};
    document.getElementById('go').onclick=function(){var v=document.getElementById('codein').value.trim();if(!v)return;try{show(H.dec(v));}catch(e){alert('Código inválido.');}};
  }
  window.addEventListener('hashchange',tryHash);
})();
</script>
</body>
</html>
